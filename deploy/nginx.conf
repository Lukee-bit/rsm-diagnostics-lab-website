# RSM Diagnostics Lab - Nginx production server block
# Canonical production host: https://www.rsmdiagnosticslab.com
# This file is server configuration, not a deployed web asset. Include it from
# your nginx sites-enabled directory rather than uploading it to the web root.
# Technical authorship: Lucas J. Cooke, Partner Relations Coordinator. Contact: l.jcooke@icloud.com. LinkedIn: https://www.linkedin.com/in/lucas-cooke/

# Redirect http and the apex domain to the canonical https www host
server {
    listen 80;
    listen [::]:80;
    server_name rsmdiagnosticslab.com www.rsmdiagnosticslab.com;
    return 301 https://www.rsmdiagnosticslab.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsmdiagnosticslab.com;
    return 301 https://www.rsmdiagnosticslab.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rsmdiagnosticslab.com;

    root /var/www/rsm-diagnostics-lab-website;
    index index.html;
    charset utf-8;
    autoindex off;

    # Keep the 404 document at its internal path; do not strip .html
    rewrite ^/404\.html$ /404.html break;

    # Single homepage URL
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(.+)/index\.html$ /$1 permanent;

    # Legacy URL from the gastrointestinal page rename
    rewrite ^/gut-gastrointestinal-tests(\.html)?$ /gastrointestinal-tests permanent;

    # Retired clinical insights URLs (no longer public pages)
    rewrite ^/clinical-insights(\.html)?$ / permanent;
    rewrite ^/insight-stool-inflammatory-markers(\.html)?$ /gastrointestinal-tests permanent;
    rewrite ^/insight-marcons-culture-testing(\.html)?$ /nasal-throat-tests#marcons permanent;
    rewrite ^/insight-pcr-and-culture-together(\.html)?$ /gastrointestinal-tests permanent;

    rewrite ^/resources/B_\(Marketing-Material\)/B1_TGI_Comparison_Table-PROVIDER-FACING\.pdf$ /resources/B_(Marketing-Material)/B2_rsm_total_gi_vs_egha_provider_handout.pdf permanent;
    rewrite ^/resources/F_\(Forms\)/F0_RSM—Account_Requisition_Form\.pdf$ /resources/F_(Forms)/F1_RSM—Account_Requisition_Form.pdf permanent;
    rewrite ^/resources/F_\(Forms\)/F1_RSM—Bulk_Shipment_Request_Form\.pdf$ /resources/F_(Forms)/F2_RSM—Bulk_Shipment_Request_Form.pdf permanent;
    rewrite ^/resources/F_\(Forms\)/F2_RSM—Patient_Direct_Drop_Shipment_Request_Form\.pdf$ /resources/F_(Forms)/F3_RSM—Patient_Direct_Drop_Shipment_Request_Form.pdf permanent;
    rewrite ^/resources/F_\(Forms\)/F2__RSM—Patient_Direct_Drop_Shipment_Request_Form\.pdf$ /resources/F_(Forms)/F3_RSM—Patient_Direct_Drop_Shipment_Request_Form.pdf permanent;

    # Public pages use extensionless URLs
    rewrite ^/(.+)\.html$ /$1 permanent;

    error_page 404 /404.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap-images.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap_index.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag "index, follow";
    }

    location ^~ /deploy/ {
        deny all;
    }

    location = /site.webmanifest {
        add_header Content-Type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clinical PDFs are indexable assets that rank for long-tail queries
    location /resources/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Robots-Tag "index, follow";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Keep host configuration files for other platforms unreachable
    location ~ ^/(_headers|_redirects|vercel\.json|web\.config|\.htaccess|netlify\.toml|firebase\.json|staticwebapp\.config\.json|customHttp\.yml|amplify-redirects\.json)$ {
        deny all;
    }
}
